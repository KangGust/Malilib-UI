name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch compile dependencies
        run: |
          set -euo pipefail
          mkdir -p libs

          fetch() {
            local slug="$1" game_ver="$2" prefix="$3"
            if ls libs/"$prefix"*.jar >/dev/null 2>&1; then
              echo "skip $slug (already present)"
              return 0
            fi
            local url
            url=$(curl -s "https://api.modrinth.com/v2/project/$slug/version" \
              | jq -r --arg gv "$game_ver" '
                  [ .[] | select(.game_versions | index($gv)) ]
                  | sort_by(.date_published) | last | .files[] | select(.primary) | .url // empty
                ')
            if [ -z "$url" ]; then
              echo "warn: $slug has no version for $game_ver"
              return 0
            fi
            echo "fetch $slug -> $url"
            curl -sSL -o "libs/$(basename "$url")" "$url"
          }

          fetch malilib 26.3 malilib
          fetch modmenu 26.3 modmenu
          ls -la libs

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: malilib-ui-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
